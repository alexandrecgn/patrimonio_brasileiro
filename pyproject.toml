[project]
name = "patrimonio-brasileiro"
version = "0.17.0"
description = "Patrimônio Brasileiro é uma aplicação em Python para buscar Bens Culturais protegidos em esfera federal existentes em uma determinada área."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fiona>=1.10.1",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "mapclassify>=2.10.0",
    "marimo>=0.23.1",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "streamlit>=1.56.0",
    "streamlit-folium>=0.27.1",
]
